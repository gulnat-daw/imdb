spring.application.name=imdb
spring.datasource.url=jdbc:mariadb://localhost:3306/imdb_dwes
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# - Consola limpia: solo lo que escribimos con println -
spring.main.banner-mode=off
logging.level.root=WARN

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:imdb_dwes_relaciones.sql
